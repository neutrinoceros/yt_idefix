[[package]]
name = "yt-idefix"
version = "2.4.3"
source = { editable = "." }
dependencies = [
    { name = "inifix" },
    { name = "numpy", version = "2.2.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.11.*'" },
    { name = "numpy", version = "2.5.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "typing-extensions", marker = "python_full_version < '3.12'" },
    { name = "yt", version = "4.4.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.10.4'" },
    { name = "yt", version = "4.4.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.10.4'" },
]

[package.optional-dependencies]
hdf5 = [
    { name = "h5py" },
]

[package.dev-dependencies]
test = [
    { name = "more-itertools" },
    { name = "pyaml" },
    { name = "pytest" },
]
typecheck = [
    { name = "mypy" },
]

[package.metadata]
requires-dist = [
    { name = "h5py", marker = "extra == 'hdf5'", specifier = ">=3.7.0" },
    { name = "inifix", specifier = ">=4.1.0" },
    { name = "numpy", specifier = ">=1.21.2" },
    { name = "typing-extensions", marker = "python_full_version < '3.12'", specifier = ">=4.4.0" },
    { name = "yt", specifier = ">=4.4.0" },
]
provides-extras = ["hdf5"]

[package.metadata.requires-dev]
test = [
    { name = "more-itertools", specifier = ">=8.4.0" },
    { name = "pyaml", specifier = ">=17.10.0" },
    { name = "pytest", specifier = ">=9.0.0" },
]
typecheck = [{ name = "mypy", specifier = ">=1.13.0" }]
